<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art C: Studio Desk — Loïc Muhirwa</title>
  <script>if (localStorage.getItem('jl-theme') === 'dark') document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="art-data.js"></script>
  <script src="art-shared.js"></script>
  <style>
    #desk { --pw: clamp(96px, 10vw, 144px); position: relative; isolation: isolate; height: clamp(520px, 78vh, 860px); overflow: hidden; border-radius: 24px; user-select: none; -webkit-user-select: none;
      background-color: #EFE9DD; background-image: radial-gradient(rgba(26, 24, 22, .1) 1px, transparent 1.2px); background-size: 22px 22px;
      box-shadow: inset 0 0 0 1px rgba(26, 24, 22, .08), inset 0 30px 60px -40px rgba(26, 24, 22, .3); transition: background-color .3s ease; }
    .dark #desk { background-color: #1B1917; background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.2px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }

    /* .print carries position and rotation (written from JS); .sheet carries the paper look and the lift. */
    .print { position: absolute; left: 0; top: 0; width: var(--pw); padding: 0; border: 0; background: none; cursor: grab; touch-action: none; will-change: transform; transition: transform .75s cubic-bezier(.2, .9, .25, 1); }
    .print.live { transition: none; }
    .print:focus-visible { outline: 2px solid #881337; outline-offset: 4px; }
    .sheet { display: block; padding: 7px; background: #fff; box-shadow: 0 1px 2px rgba(26, 24, 22, .25), 0 10px 22px -10px rgba(26, 24, 22, .45); transition: transform .25s ease, box-shadow .25s ease; }
    .dark .sheet { background: #F4F1EA; box-shadow: 0 1px 2px rgba(0, 0, 0, .6), 0 14px 28px -10px rgba(0, 0, 0, .9); }
    .sheet img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; pointer-events: none; }
    .print:hover .sheet { transform: scale(1.03); }
    .print.lift { cursor: grabbing; }
    .print.lift .sheet { transform: scale(1.07); box-shadow: 0 2px 4px rgba(26, 24, 22, .2), 0 36px 50px -18px rgba(26, 24, 22, .6); }

    .pile-label { position: absolute; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
    #desk[data-mode="piles"] .pile-label { opacity: 1; transition-delay: .35s; }
    .mode[aria-pressed="true"] { background: #1A1816; color: #fff; }
    .dark .mode[aria-pressed="true"] { background: #e7e5e4; color: #1A1816; }
  </style>
</head>
<body class="bg-[#FBF9F5] dark:bg-[#121211] text-[#24211E] dark:text-[#E8E5DF] font-sans antialiased transition-colors duration-300">
  <script>ArtUtil.bar('c')</script>

  <header class="max-w-6xl mx-auto px-6 pt-20 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-5">
    <div>
      <span class="font-mono text-xs text-rose-900 dark:text-rose-400 uppercase tracking-widest font-semibold">03 / Art</span>
      <h1 class="font-serif text-4xl md:text-5xl tracking-tight text-ink-900 dark:text-stone-100 mt-2">
        Loose prints on the <span class="italic text-rose-900 dark:text-rose-400">studio desk</span>.
      </h1>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      <span class="font-mono text-[11px] text-stone-500 dark:text-stone-400">drag a print · click to open</span>
      <div class="flex p-0.5 rounded-full border border-stone-300 dark:border-stone-700 font-mono text-[11px]" role="group" aria-label="Arrange the prints">
        <button class="mode px-3 py-1.5 rounded-full transition" data-mode="scatter" aria-pressed="true">Scatter</button>
        <button class="mode px-3 py-1.5 rounded-full transition" data-mode="piles" aria-pressed="false">By series</button>
        <button class="mode px-3 py-1.5 rounded-full transition" data-mode="tidy" aria-pressed="false">Tidy</button>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 sm:px-6 pb-16">
    <section id="desk" data-mode="scatter" aria-label="Prints on a desk"></section>
  </div>

<script>
(() => {
  const A = window.ART, U = window.ArtUtil, P = A.pieces, N = P.length;
  const desk = document.getElementById('desk');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // Small seeded generator, so the first scatter looks the same on every load.
  const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  desk.innerHTML = P.map((p) => `
    <button class="print" data-i="${p.i}" aria-label="Open ${U.esc(U.name(p))}">
      <span class="sheet"><img src="${p.src}" alt="${U.esc(U.alt(p))}" draggable="false"></span>
    </button>`).join('') + A.series.map((s) => `
    <div class="pile-label">
      <p class="font-serif text-xl text-ink-900 dark:text-stone-100">${U.esc(s.title)}</p>
      <p class="font-mono text-[10px] uppercase tracking-widest text-stone-500">${s.count} works</p>
    </div>`).join('');
  const els = [...desk.querySelectorAll('.print')], labels = [...desk.querySelectorAll('.pile-label')];

  // One record per print: top-left corner in desk pixels, rotation, scale, stacking order.
  const S = P.map(() => ({ x: 0, y: 0, r: 0, s: 1, z: 1 }));
  let DW = 0, DH = 0, PW = 0, PH = 0, zTop = N, mode = 'scatter', seed = 7;
  const put = (i) => {
    const s = S[i];
    els[i].style.transform = `translate3d(${s.x}px, ${s.y}px, 0) rotate(${s.r}deg) scale(${s.s})`;
    els[i].style.zIndex = s.z;
  };
  const measure = () => { DW = desk.clientWidth; DH = desk.clientHeight; PW = els[0].offsetWidth; PH = els[0].offsetHeight; };

  const layouts = {
    // Dropped on the desk: a loose grid with every print nudged and turned.
    scatter() {
      const rnd = rng(seed), cols = clamp(Math.round(DW / (PW * 1.15)), 3, 8), rows = Math.ceil(N / cols);
      const cw = (DW - PW * 0.2) / cols, ch = (DH - 40) / rows;
      const order = P.map((_, i) => i).sort(() => rnd() - 0.5);
      order.forEach((i, k) => {
        const row = Math.floor(k / cols), inRow = row === rows - 1 ? N - row * cols : cols;
        const col = (k % cols) + (cols - inRow) / 2;
        const cx = PW * 0.1 + (col + 0.5) * cw + (rnd() - 0.5) * cw * 0.5, cy = 20 + (row + 0.5) * ch + (rnd() - 0.5) * ch * 0.35;
        Object.assign(S[i], { x: clamp(cx - PW / 2, 8, DW - PW - 8), y: clamp(cy - PH / 2, 8, DH - PH - 8), r: (rnd() - 0.5) * 30, s: 1, z: k + 1 });
      });
    },
    // Three fanned piles, one per series.
    piles() {
      const fit = Math.min(1, (DW / 3) * 0.62 / PW);
      A.series.forEach((s, si) => {
        const cx = (DW * (si + 0.5)) / 3, cy = DH * 0.44;
        s.pieces.forEach((p, k) => {
          const o = k - (s.count - 1) / 2;
          Object.assign(S[p.i], { x: cx - PW / 2 + o * Math.min(16, DW * 0.012), y: cy - PH / 2 + Math.abs(o) * 3, r: o * 5, s: fit, z: k + 1 });
        });
        labels[si].style.left = cx + 'px';
        labels[si].style.top = cy + (PH * fit) / 2 + 34 + 'px';
      });
    },
    // Squared up in rows: pick the column count that lets the prints stay largest.
    tidy() {
      let best = { sc: 0 };
      for (let cols = 2; cols <= N; cols++) {
        const rows = Math.ceil(N / cols), cw = (DW - 32) / cols, ch = (DH - 32) / rows, sc = Math.min(1, (cw * 0.9) / PW, (ch * 0.9) / PH);
        if (sc > best.sc) best = { sc, cols, cw, ch };
      }
      P.forEach((_, i) => {
        const col = i % best.cols, row = Math.floor(i / best.cols);
        Object.assign(S[i], { x: 16 + (col + 0.5) * best.cw - PW / 2, y: 16 + (row + 0.5) * best.ch - PH / 2, r: 0, s: best.sc, z: i + 1 });
      });
    },
  };

  const arrange = (m, stagger = true) => {
    mode = m;
    desk.dataset.mode = m;
    document.querySelectorAll('.mode').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === m));
    measure();
    layouts[m]();
    zTop = N;
    els.forEach((el, i) => {
      glide.delete(i);
      el.classList.remove('live');
      el.style.transitionDelay = stagger ? S[i].z * 14 + 'ms' : '0ms';
      put(i);
    });
  };

  // ── Dragging, with the print sliding on a little after a throw
  const glide = new Map(); // print index -> velocity in px/ms
  let raf = 0, last = 0;
  const bounds = () => ({ x0: -PW * 0.35, x1: DW - PW * 0.65, y0: -PH * 0.35, y1: DH - PH * 0.65 });
  const step = (t) => {
    const dt = Math.min(40, t - last);
    last = t;
    const b = bounds();
    glide.forEach((v, i) => {
      const s = S[i], k = Math.pow(0.9, dt / 16);
      s.x += v.x * dt; s.y += v.y * dt; s.r += v.x * dt * 0.03;
      v.x *= k; v.y *= k;
      if (s.x < b.x0 || s.x > b.x1) { s.x = clamp(s.x, b.x0, b.x1); v.x *= -0.4; }
      if (s.y < b.y0 || s.y > b.y1) { s.y = clamp(s.y, b.y0, b.y1); v.y *= -0.4; }
      put(i);
      if (Math.hypot(v.x, v.y) < 0.02) glide.delete(i);
    });
    raf = glide.size ? requestAnimationFrame(step) : 0;
  };

  let drag = null;
  desk.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.print');
    if (!el || e.button) return;
    const i = +el.dataset.i;
    glide.delete(i);
    drag = { i, el, ox: e.clientX - S[i].x, oy: e.clientY - S[i].y, sx: e.clientX, sy: e.clientY, moved: 0, at: e.timeStamp, px: e.clientX, py: e.clientY, pt: e.timeStamp, vx: 0, vy: 0 };
    S[i].z = ++zTop;
    el.style.transitionDelay = '0ms';
    el.classList.add('live', 'lift');
    el.setPointerCapture(e.pointerId);
    put(i);
  });
  desk.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const d = drag, s = S[d.i], b = bounds(), dt = e.timeStamp - d.pt;
    d.moved = Math.max(d.moved, Math.hypot(e.clientX - d.sx, e.clientY - d.sy));
    s.x = clamp(e.clientX - d.ox, b.x0, b.x1);
    s.y = clamp(e.clientY - d.oy, b.y0, b.y1);
    if (dt > 0) { d.vx = d.vx * 0.5 + ((e.clientX - d.px) / dt) * 0.5; d.vy = d.vy * 0.5 + ((e.clientY - d.py) / dt) * 0.5; }
    d.px = e.clientX; d.py = e.clientY; d.pt = e.timeStamp;
    put(d.i);
  });
  const drop = (e) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    d.el.classList.remove('lift');
    if (e.type === 'pointerup' && d.moved < 6 && e.timeStamp - d.at < 500) {
      d.el.classList.remove('live');
      open(d.i);
    } else if (e.timeStamp - d.pt < 80 && Math.hypot(d.vx, d.vy) > 0.05) {
      glide.set(d.i, { x: clamp(d.vx, -2.5, 2.5), y: clamp(d.vy, -2.5, 2.5) });
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); }
    }
  };
  desk.addEventListener('pointerup', drop);
  desk.addEventListener('pointercancel', drop);

  const open = (i) => ArtViewer.open(i, { origin: (j) => els[j].querySelector('img') });
  // Pointer taps are handled above; this covers Enter / Space on a focused print.
  desk.addEventListener('click', (e) => { const el = e.target.closest('.print'); if (el && e.detail === 0) open(+el.dataset.i); });

  document.querySelectorAll('.mode').forEach((b) => {
    b.onclick = () => {
      if (b.dataset.mode === 'scatter' && mode === 'scatter') seed++; // pressing Scatter again deals a new arrangement
      arrange(b.dataset.mode);
    };
  });

  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => arrange(mode, false), 120); });

  // Entrance: everything starts as one stack in the middle, then gets dealt out.
  measure();
  els.forEach((el, i) => { el.classList.add('live'); Object.assign(S[i], { x: (DW - PW) / 2, y: (DH - PH) / 2, r: (i % 5) - 2, s: 1, z: i + 1 }); put(i); });
  requestAnimationFrame(() => requestAnimationFrame(() => arrange('scatter')));
})();
</script>
</body>
</html>
