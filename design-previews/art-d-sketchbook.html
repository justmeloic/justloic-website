<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art D: Sketchbook — Loïc Muhirwa</title>
  <script>if (localStorage.getItem('jl-theme') === 'dark') document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="art-data.js"></script>
  <script src="art-shared.js"></script>
  <style>
    /* Everything in the book is sized from the page width, so it scales as one object. */
    #scene { --ph: min(64vh, 600px, 61vw); --pw: calc(var(--ph) * .75); overflow: hidden; padding: 28px 0 44px; }
    #book { position: relative; isolation: isolate; width: calc(var(--pw) * 2); height: var(--ph); margin: 0 auto; transition: transform .8s cubic-bezier(.45, .05, .55, .95); }
    #book.closed { transform: translateX(calc(var(--pw) / -2)); }

    .board { position: absolute; inset: -7px -9px; z-index: 0; border-radius: 8px; background: #1F1B18; box-shadow: 0 34px 60px -24px rgba(26, 24, 22, .55), 0 0 0 1px rgba(255, 255, 255, .05); transition: left .8s cubic-bezier(.45, .05, .55, .95); }
    #book.closed .board { left: calc(50% - 3px); }
    .block { position: absolute; top: 0; z-index: 0; width: var(--pw); height: var(--ph); background: #EFE8DA; transition: opacity .5s ease; }
    .block.r { left: 50%; border-radius: 2px 5px 5px 2px; box-shadow: 1px 0 0 #D9D0BE, 3px 1px 0 #EFE8DA, 4px 1px 0 #D9D0BE, 6px 2px 0 #EFE8DA, 7px 2px 0 #CFC5B1; }
    .block.l { left: 0; border-radius: 5px 2px 2px 5px; box-shadow: -1px 0 0 #D9D0BE, -3px 1px 0 #EFE8DA, -4px 1px 0 #D9D0BE; }
    #book.closed .block.l { opacity: 0; }

    /* A leaf hinges on the spine. Its two faces are back to back, so turning it shows the other side. */
    .leaf { position: absolute; left: 50%; top: 0; width: var(--pw); height: var(--ph); transform-origin: left center; transform-style: preserve-3d; transform: perspective(2400px) rotateY(0deg);
      transition: transform .85s cubic-bezier(.45, .05, .55, .95); cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
    .leaf.flipped { transform: perspective(2400px) rotateY(-180deg); }
    .leaf.manual { transition: none; }
    .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; background-color: #F7F2E8; color: #24211E; }
    .recto { border-radius: 2px 5px 5px 2px; background-image: linear-gradient(to right, rgba(60, 45, 30, .2), rgba(60, 45, 30, 0) 10%); }
    .verso { transform: rotateY(180deg); border-radius: 5px 2px 2px 5px; background-image: linear-gradient(to left, rgba(60, 45, 30, .2), rgba(60, 45, 30, 0) 10%); }

    /* The scan is multiplied onto the page so its paper takes on the sketchbook's tone. */
    .plate { position: absolute; inset: 7%; }
    .plate img { display: block; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; -webkit-user-drag: none; }
    .zoom { position: absolute; right: 3.5%; bottom: 2.6%; width: calc(var(--pw) * .085); height: calc(var(--pw) * .085); min-width: 26px; min-height: 26px; display: grid; place-items: center; border-radius: 9999px; border: 1px solid rgba(36, 33, 30, .25);
      background: rgba(247, 242, 232, .85); color: #24211E; font: 13px/1 'JetBrains Mono', monospace; opacity: 0; transition: opacity .2s ease; }
    .leaf:hover .zoom, .zoom:focus-visible { opacity: 1; }
    @media (hover: none) { .zoom { opacity: 1; } }

    .cap { position: absolute; inset: 9% 11% 8% 9%; display: flex; flex-direction: column; justify-content: space-between; }
    .cap .k { font: 500 calc(var(--pw) * .026)/1.4 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #78716C; }
    .cap h2 { font: 400 calc(var(--pw) * .115)/1.05 'Newsreader', serif; letter-spacing: -.01em; margin-top: .25em; }
    .cap .b { font: italic 400 calc(var(--pw) * .048)/1.35 'Newsreader', serif; color: #57534E; margin-top: .5em; max-width: 16em; }
    .cap .n { font: 300 calc(var(--pw) * .2)/1 'Newsreader', serif; color: #881337; letter-spacing: -.02em; }
    .cap .n small { font-size: .32em; letter-spacing: 0; color: #78716C; font-style: italic; }

    .cover { background-color: #1F1B18; color: #C9A26B;
      background-image: linear-gradient(to right, rgba(0, 0, 0, .5), rgba(0, 0, 0, 0) 7%), repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(255, 255, 255, .02) 0 1px, transparent 1px 3px); }
    .cover::after { content: ''; position: absolute; top: 0; bottom: 0; right: 8%; width: 2.4%; background: #0E0C0B; box-shadow: 0 0 6px rgba(0, 0, 0, .6); }
    .cover .cap { inset: 14% 20% 9% 13%; }
    .cover .k { color: #8A7556; }
    .cover h2 { font-style: italic; color: #C9A26B; }
    .cover .b { color: #8A7556; }
    .cover .o { font: 500 calc(var(--pw) * .028)/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #8A7556; }

    .chip[aria-pressed="true"] { background: #1A1816; color: #fff; border-color: #1A1816; }
    .dark .chip[aria-pressed="true"] { background: #e7e5e4; color: #1A1816; border-color: #e7e5e4; }

    @media (max-width: 639px) {
      /* Phones: one page at a time. The right-hand page is centred; the facing page sits off screen. */
      #scene { --ph: min(64vh, 117vw); }
      #book { margin-left: calc(50vw - var(--pw) * 1.5); }
      #book.closed { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { .leaf, #book, .board { transition: none; } }
  </style>
</head>
<body class="bg-[#FBF9F5] dark:bg-[#121211] text-[#24211E] dark:text-[#E8E5DF] font-sans antialiased transition-colors duration-300">
  <script>ArtUtil.bar('d')</script>

  <header class="max-w-5xl mx-auto px-6 pt-20 text-center">
    <span class="font-mono text-xs text-rose-900 dark:text-rose-400 uppercase tracking-widest font-semibold">03 / Art</span>
    <h1 class="font-serif text-4xl md:text-5xl tracking-tight text-ink-900 dark:text-stone-100 mt-2">
      Straight from the <span class="italic text-rose-900 dark:text-rose-400">sketchbook</span>.
    </h1>
  </header>

  <section id="scene" aria-label="Sketchbook"><div id="book" class="closed"></div></section>

  <div class="max-w-xl mx-auto px-6 pb-20 -mt-4 space-y-5">
    <div class="flex items-center justify-between gap-4">
      <button id="prev" aria-label="Previous page" class="shrink-0 w-9 h-9 rounded-full border border-stone-300 dark:border-stone-700 font-mono text-sm text-stone-600 dark:text-stone-300 hover:border-stone-900 dark:hover:border-stone-100 disabled:opacity-30 disabled:pointer-events-none transition">←</button>
      <div class="text-center min-w-0" aria-live="polite">
        <p id="capName" class="font-serif text-xl text-ink-900 dark:text-stone-100 truncate"></p>
        <p id="capMeta" class="font-mono text-[11px] text-stone-500 dark:text-stone-400 tabular-nums"></p>
      </div>
      <button id="next" aria-label="Next page" class="shrink-0 w-9 h-9 rounded-full border border-stone-300 dark:border-stone-700 font-mono text-sm text-stone-600 dark:text-stone-300 hover:border-stone-900 dark:hover:border-stone-100 disabled:opacity-30 disabled:pointer-events-none transition">→</button>
    </div>
    <div id="chips" class="flex flex-wrap justify-center gap-2 font-mono text-[11px]"></div>
    <p class="text-center font-mono text-[11px] text-stone-500 dark:text-stone-400 hidden sm:block">click or drag a page to turn it · ← → · ⤢ to enlarge</p>
  </div>

<script>
(() => {
  const A = window.ART, U = window.ArtUtil, P = A.pieces, N = P.length, L = N + 1;
  const $ = (id) => document.getElementById(id);
  const book = $('book'), DUR = 850, GAP = 90, ROMAN = ['I', 'II', 'III', 'IV', 'V'];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Leaf 0 is the cover. Leaf j carries drawing j on its front; the back of the leaf before it carries that drawing's caption,
  // so every spread reads caption on the left, drawing on the right.
  const caption = (p) => `
    <div class="cap">
      <div>
        <p class="k">${p.n === 1 ? `Series ${ROMAN[A.series.indexOf(p.s)]}` : U.esc(p.s.title)}</p>
        ${p.n === 1 ? `<h2>${U.esc(p.s.title)}</h2>${p.s.blurb ? `<p class="b">${U.esc(p.s.blurb)}</p>` : ''}` : ''}
        ${p.title ? `<p class="b">${U.esc(p.title)}</p>` : ''}
      </div>
      <div>
        <p class="n">${U.pad(p.n)} <small>of ${U.pad(p.s.count)}</small></p>
        <p class="k" style="margin-top:.8em">${U.esc(U.meta(p))}</p>
      </div>
    </div>`;
  const plate = (p) => `
    <div class="plate"><img src="${p.src}" alt="${U.esc(U.alt(p))}" draggable="false"></div>
    <button class="zoom" data-zoom="${p.i}" aria-label="Enlarge ${U.esc(U.name(p))}">⤢</button>`;
  const cover = `
    <div class="cap">
      <div><p class="k">Sketchbook</p><h2>Drawings</h2><p class="b">${A.series.map((s) => U.esc(s.title)).join(' · ')}</p></div>
      <div><p class="k">${U.esc(A.artist)}</p><p class="o" style="margin-top:1.2em">Open →</p></div>
    </div>`;

  book.innerHTML = '<div class="board"></div><div class="block l"></div><div class="block r"></div>' + Array.from({ length: L }, (_, j) => `
    <div class="leaf" style="z-index:${L - j}">
      <div class="face recto ${j ? '' : 'cover'}">${j ? plate(P[j - 1]) : cover}</div>
      <div class="face verso">${j < N ? caption(P[j]) : ''}</div>
    </div>`).join('');
  const leaves = [...book.querySelectorAll('.leaf')];

  $('chips').innerHTML = `<button class="chip px-3 py-1.5 rounded-full border border-stone-300 dark:border-stone-700 transition" data-go="0">Cover</button>` +
    A.series.map((s) => `<button class="chip px-3 py-1.5 rounded-full border border-stone-300 dark:border-stone-700 transition" data-go="${s.first + 1}">${U.esc(s.title)}</button>`).join('');
  const chips = [...$('chips').children];

  // page = how many leaves have been turned. 0 is the closed book; page k shows drawing k.
  let page = 0;
  // A turning leaf belongs to the right-hand stack until it is edge-on, then to the left-hand one.
  const setZ = (i, flipped) => { leaves[i].style.zIndex = flipped ? i + 1 : L - i; };
  const timers = new Map();
  const turn = (i, flipped, delay) => {
    (timers.get(i) || []).forEach(clearTimeout);
    const t = [setTimeout(() => {
      leaves[i].classList.toggle('flipped', flipped);
      t.push(setTimeout(() => setZ(i, flipped), still ? 0 : DUR / 2));
    }, delay)];
    timers.set(i, t);
  };

  const sync = () => {
    book.classList.toggle('closed', page === 0);
    const p = P[page - 1];
    $('capName').textContent = p ? U.name(p) : 'Sketchbook';
    $('capMeta').textContent = p ? `${U.pad(page)} / ${U.pad(N)}` : `${N} drawings · open the cover`;
    $('prev').disabled = page === 0;
    $('next').disabled = page === N;
    chips.forEach((c, k) => c.setAttribute('aria-pressed', k === 0 ? page === 0 : !!p && p.s === A.series[k - 1]));
    // Only the drawing that is face up should be reachable by Tab.
    leaves.forEach((el, j) => el.querySelector('.zoom')?.setAttribute('tabindex', j === page ? 0 : -1));
  };

  const goTo = (n) => {
    n = clamp(n, 0, N);
    if (n > page) for (let i = page, k = 0; i < n; i++, k++) turn(i, true, k * GAP);
    else for (let i = page - 1, k = 0; i >= n; i--, k++) turn(i, false, k * GAP);
    page = n;
    sync();
  };
  // Used while the viewer is open: put the book on a page without animating.
  const jump = (n) => {
    leaves.forEach((el, i) => {
      (timers.get(i) || []).forEach(clearTimeout);
      el.classList.add('manual');
      el.classList.toggle('flipped', i < n);
      setZ(i, i < n);
    });
    void book.offsetWidth;
    leaves.forEach((el) => el.classList.remove('manual'));
    page = n;
    sync();
  };

  // ── Click a page to turn it, or drag it across by hand
  let drag = null;
  book.addEventListener('pointerdown', (e) => {
    const leaf = e.target.closest('.leaf');
    if (!leaf || e.button || e.target.closest('.zoom')) return;
    const i = leaves.indexOf(leaf), flipped = leaf.classList.contains('flipped');
    if (i !== (flipped ? page - 1 : page) || (!flipped && page === N)) return; // only the top leaf of either stack turns
    drag = { i, leaf, flipped, sx: e.clientX, dx: 0, moved: 0, angle: flipped ? 180 : 0 };
    leaf.setPointerCapture(e.pointerId);
  });
  book.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const d = drag;
    d.dx = e.clientX - d.sx;
    d.moved = Math.max(d.moved, Math.abs(d.dx));
    if (d.moved < 6) return;
    const swing = clamp((Math.abs(d.dx) / d.leaf.offsetWidth) * 105, 0, 180);
    d.angle = d.flipped ? 180 - (d.dx > 0 ? swing : 0) : d.dx < 0 ? swing : 0;
    d.leaf.classList.add('manual');
    d.leaf.style.transform = `perspective(2400px) rotateY(${-d.angle}deg)`;
    setZ(d.i, d.angle > 90);
  });
  const release = (e) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    d.leaf.classList.remove('manual');
    d.leaf.style.transform = '';
    if (e.type === 'pointerup' && d.moved < 6) return goTo(page + (d.flipped ? -1 : 1));
    // Let go past a third of the way and the page carries on over; otherwise it falls back.
    const flipped = d.flipped ? d.angle > 120 : d.angle > 60;
    d.leaf.classList.toggle('flipped', flipped);
    setZ(d.i, flipped);
    if (flipped !== d.flipped) { page += flipped ? 1 : -1; sync(); }
    else if (!d.flipped && d.dx > 40) goTo(page - 1); // swiping the right-hand page backwards goes back a page
  };
  book.addEventListener('pointerup', release);
  book.addEventListener('pointercancel', release);

  book.addEventListener('click', (e) => {
    const z = e.target.closest('[data-zoom]');
    if (!z) return;
    ArtViewer.open(+z.dataset.zoom, {
      origin: (i) => (i === page - 1 ? leaves[i + 1].querySelector('.plate img') : null),
      onChange: (i) => jump(i + 1),
    });
  });

  $('prev').onclick = () => goTo(page - 1);
  $('next').onclick = () => goTo(page + 1);
  $('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) goTo(+b.dataset.go); });
  document.addEventListener('keydown', (e) => {
    const n = { ArrowLeft: page - 1, ArrowRight: page + 1, Home: 0, End: N }[e.key];
    if (n !== undefined) { e.preventDefault(); goTo(n); }
  });

  sync();
})();
</script>
</body>
</html>
