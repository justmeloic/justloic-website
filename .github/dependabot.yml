# Monthly, grouped dependency updates: at most one PR per ecosystem per month.
# Netlify builds a deploy preview for each PR, and CI must pass before you merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /services/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
